[tools]
node = "system"
nub = "0.7.5"
hk = "latest"
pkl = "latest"

[tasks.dev]
description = "Start the sidebar demo dev server"
run = "nub run dev"

[tasks.typecheck]
description = "Typecheck all workspace packages"
run = "nub run typecheck"

[tasks.lint]
description = "Lint all workspace packages (oxlint + plugins)"
run = "nub run lint"

[tasks.format]
description = "Check formatting (prettier, foldkit style)"
run = "nub run format:check"

[tasks.fallow]
description = "Codebase intelligence (dead code, circular deps, dupes, health)"
run = "nub run check:fallow"

[tasks.test]
description = "Run vitest across workspace packages"
run = "nub run test"

[tasks.waivers]
description = "Frozen waiver / disable-comment ratchet"
run = "nub run check:waivers"

[tasks.pre-commit]
description = "Run pre-commit hooks"
run = "hk run pre-commit"

[tasks.pre-push]
description = "Run the full pre-push gate"
run = "hk run pre-push"

[tasks.check]
description = "Full workspace quality gate"
run = "nub run check"

[tasks.check-packed]
description = "Pack all external-consumer packages and smoke a throwaway Vite consumer"
run = "nub run check:packed"
